<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialHub – Proyectos</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="estilos-comunes.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="publico-proyectos.css" />
  <script src="auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/publico-proyectos.js"></script>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="publico-inicio.html" class="navbar-logo">
        <img src="assets/img/logo.png" alt="Logo SocialHub" class="navbar-logo-icon">
        <div class="navbar-logo-text">
          <span class="navbar-logo-title">SocialHub</span>
          <span class="navbar-logo-sub">Servicio Social</span>
        </div>
      </a>
      <div class="navbar-links" id="nav-links">
        <a href="publico-inicio.html" class="navbar-link">Inicio</a>
        <a href="publico-proyectos.html" class="navbar-link active">Proyectos</a>
        <a href="foro.html?rol=publico" class="navbar-link">Foro</a>
      </div>
      <div class="navbar-right" id="nav-right"></div>
    </div>
  </nav>

  <div class="encabezado-catalogo">
    <h1>Catálogo de <span class="colorcitoo">Proyectos</span></h1>
    <p>Explora todas las iniciativas solidarias</p>
  </div>

  <div class="barra-filtros">

    <!-- Búsqueda por texto -->
    <div class="campo-busqueda">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="inputBusqueda" placeholder="Buscar proyectos..." />
    </div>

    <!-- Filtro por ODS -->
    <select class="select-catalogo filtro-select" data-catalogo="ods" id="filtroODS">

    </select>

    <!-- Filtro por población -->
    <select class="select-catalogo filtro-select" data-catalogo = "poblaciones"id="filtroPoblacion">
    
    </select>

  </div>

  <!-- Contador de resultados -->
  <div class="contador-resultados" id="contadorResultados">
    Cargando proyectos...
  </div>

  <!-- ===== CUADRÍCULA DE PROYECTOS ===== -->
  <div class="catalogo-contenido">
    <div class="cuadricula-catalogo" id="cuadriculaCatalogo">
      <!-- Las tarjetas se generan con JavaScript -->
    </div>

    <!-- Estado vacío (se muestra si no hay resultados) -->
    <div class="estado-vacio" id="estadoVacio">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none"
           stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <h3>No se encontraron proyectos</h3>
      <p>Intenta con otros filtros o términos de búsqueda.</p>
    </div>
  </div>

  <!-- ===== JAVASCRIPT ===== -->
  <script>

    var paleta = ['#5CA09E', '#9B5BA5', '#D7685B', '#7AB8DD', '#E89042', '#6366f1'];

    function norm(s) {
      return (s || '').toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/-/g, ' ');
    }

    function estadoLabel(e) { return e === 'activo' ? 'Activo' : 'Inactivo'; }
    function colorBadge(e)  { return e === 'activo' ? '#15803d' : '#64748b'; }

    /* Convierte un proyecto del API al formato interno
       El API devuelve:
         p.ods_ids        → array de ids     [3, 15]  (si el backend los incluye)
         p.ods            → string de nombres "ODS 3: Salud..., ODS 15: ..."
         p.poblacion_ids  → array de ids     [1, 2]
         p.poblacion      → string de nombres
    */
    function mapear(p) {
      var odsLabels = [];
      if (Array.isArray(p.ods)) {
        odsLabels = p.ods;
      } else if (p.ods) {
        odsLabels = p.ods.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      }

      // IDs para filtrado: preferir el campo de ids si existe, si no extraer del string
      var odsIds = Array.isArray(p.ods_ids) ? p.ods_ids.map(Number) : [];
      var pobIds = Array.isArray(p.poblacion_ids) ? p.poblacion_ids.map(Number) : [];

      var pobLabels = [];
      if (Array.isArray(p.poblacion)) {
        pobLabels = p.poblacion;
      } else if (p.poblacion) {
        pobLabels = p.poblacion.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
      }

      return {
        id:          p.id_proyecto,
        titulo:      p.nombre       || '',
        descripcion: p.descripcion_corta || '',
        estado:      p.estado       || '',
        estadoLabel: estadoLabel(p.estado),
        color:       paleta[(p.id_proyecto - 1) % paleta.length],
        odsLabels:   odsLabels,
        odsIds:      odsIds,
        pobLabels:   pobLabels,
        pobIds:      pobIds,
        lider:       p.lider        || '—',
        categoria:   p.categoria    || ''
      };
    }

    var icoPersonas = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>';
    var icoCorazon  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

    function htmlChips(labels) {
      return labels.slice(0, 3).map(function (l) {
        return '<span class="chip-ods">' + l + '</span>';
      }).join('');
    }

    function htmlTarjeta(p) {
      var letra = (p.titulo || '?').charAt(0).toUpperCase();
      return `
        <div class="tarjeta-catalogo">
          <div class="catalogo-banner" style="background-color:${p.color};">
            <div class="chips-ods">${htmlChips(p.odsLabels)}</div>
            <span class="badge-catalogo" style="color:${colorBadge(p.estado)};">● ${p.estadoLabel}</span>
            <div class="catalogo-letra-fondo">${letra}</div>
          </div>
          <div class="catalogo-cuerpo">
            <div class="catalogo-titulo">${p.titulo}</div>
            <div class="catalogo-desc">${p.descripcion}</div>
            <div class="catalogo-stats">
              <div class="catalogo-stat">
                ${icoPersonas} <span style="font-weight:600;color:#0f172a;">${p.lider}</span>
              </div>
              <div class="catalogo-stat" style="color:#64748b;">
                ${icoCorazon} <span>${p.categoria}</span>
              </div>
            </div>
            <a class="catalogo-btn" href="proyecto-detalle.html?id=${p.id}" style="background-color:${p.color};">
              Ver detalles del proyecto →
            </a>
          </div>
        </div>`;
    }

    var contenedor  = document.getElementById('cuadriculaCatalogo');
    var estadoVacio = document.getElementById('estadoVacio');
    var contador    = document.getElementById('contadorResultados');
    var proyectos   = [];

    function renderizar(lista) {
      if (lista.length === 0) {
        contenedor.innerHTML = '';
        estadoVacio.style.display = 'block';
        contador.textContent = 'Sin resultados para tu búsqueda.';
      } else {
        estadoVacio.style.display = 'none';
        var n = lista.length;
        contador.textContent = n + ' proyecto' + (n !== 1 ? 's' : '') + ' encontrado' + (n !== 1 ? 's' : '');
        contenedor.innerHTML = lista.map(htmlTarjeta).join('');
      }
    }

    function aplicarFiltros() {
      var texto   = norm(document.getElementById('inputBusqueda').value.trim());
      var odsVal  = document.getElementById('filtroODS').value;       // '' o id como string
      var pobVal  = document.getElementById('filtroPoblacion').value;  // '' o id como string

      var filtrados = proyectos.filter(function (p) {

        // Texto en título o descripción
        var pasaTexto = texto === '' ||
          norm(p.titulo).includes(texto) ||
          norm(p.descripcion).includes(texto);

        // ODS: comparar por id si el proyecto tiene odsIds, si no por texto normalizado
        var pasaODS = odsVal === '' || (function() {
          var id = parseInt(odsVal);
          if (p.odsIds.length > 0) {
            return p.odsIds.includes(id);
          }
          // Fallback: buscar el número del ODS en los labels
          return p.odsLabels.some(function(l) {
            var m = l.match(/ODS\s*(\d+)/i);
            return m && parseInt(m[1]) === id;
          });
        })();

        // Población: comparar por id si el proyecto tiene pobIds, si no por texto
        var pasaPob = pobVal === '' || (function() {
          var id = parseInt(pobVal);
          if (p.pobIds.length > 0) {
            return p.pobIds.includes(id);
          }
          return p.pobLabels.some(function(l) {
            return norm(l).includes(norm(pobVal));
          });
        })();

        return pasaTexto && pasaODS && pasaPob;
      });

      renderizar(filtrados);
    }

    /* ── Carga inicial ──────────────────────────────────────── */
    fetch('/api/proyectos')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var lista = Array.isArray(data) ? data : (data.data || []);
        proyectos = lista.map(mapear);
        renderizar(proyectos);
      })
      .catch(function () {
        contador.textContent = 'No hay proyectos disponibles en este momento. ¡Vuelve pronto!';
      });

    document.getElementById('inputBusqueda').addEventListener('input', aplicarFiltros);
    document.getElementById('filtroODS').addEventListener('change', aplicarFiltros);
    document.getElementById('filtroPoblacion').addEventListener('change', aplicarFiltros);

  </script>

</body>
</html>
