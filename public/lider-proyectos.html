<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SocialHub — Mis Proyectos</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="lider-proyectos.css">
<script src="auth.js"></script>
<script src="js/navbar.js"></script>
<script src="js/lider-proyectos.js"></script>
</head>
<body>

<!-- NAVBAR LÍDER -->
<nav class="navbar">
  <div class="navbar-inner">
    <a href="lider-proyectos.html" class="navbar-logo">
      <img src="assets/img/logo.png" alt="Logo SocialHub" class="navbar-logo-icon">
      <div class="navbar-logo-text">
        <div class="navbar-logo-title">SocialHub</div>
        <div class="navbar-logo-sub">Servicio Social</div>
      </div>
    </a>
    <div class="navbar-links" id="nav-links">
    </div>
    <div class="navbar-right" id="nav-right">
    </div>
  </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <div>
      <div class="page-title">Mis Proyectos</div>
      <div class="page-subtitle">Gestiona, edita y sube métricas de tus proyectos activos</div>
    </div>

  </div>
</div>

<!-- STATS STRIP -->
<div class="stats-strip">
  <div class="stats-strip-inner">
    <div class="strip-stat">
      <div class="strip-dot" style="background:var(--verde)"></div>
      <span class="strip-label">Activos:</span>
      <span class="strip-val" id="stat-activos">0</span>
    </div>

    <div class="strip-stat">
      <div class="strip-dot" style="background:var(--gris-300)"></div>
      <span class="strip-label">Inactivos:</span>
      <span class="strip-val" id="stat-inactivos">0</span>
    </div>
    <div style="margin-left:auto; display:flex; gap:24px; align-items:center;">
      <div class="strip-stat">
    
      </div>
      <div class="strip-stat">

      </div>
    </div>

  </div>

    <div style="max-width:1200px;margin:20px auto 0;padding:0 24px;display:flex;justify-content:flex-end;">
      <a
        href="#"
        class="btn btn-outline btn-sm"
        onclick="logout()"
      >
        🚪 Cerrar sesión
      </a>
    </div>
    <br>


  
</div>


<!-- MAIN -->
<div class="main-layout">
  <div class="proj-grid"  id="projects-grid">
    Cargando proyectos...
  </div>
</div>





</body>
</html>
