<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tec con Causa – Login</title>

  <!-- Importamos la fuente de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Nuestro archivo de estilos separado -->
  <link rel="stylesheet" href="login.css" />
</head>

<body>

  <!-- Tarjeta blanca del centro -->
  <div class="tarjeta-login">

    <!-- Logo arriba -->
    <div class="logo-contenedor">
      <!-- Cuadrito azul con un corazón SVG adentro -->
      <div class="logo-icono">
        <!-- SVG es un dibujo vectorial hecho con código -->
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Forma de corazón -->
          <path d="M18 30s-13-8.5-13-17a9 9 0 0 1 13-8.06A9 9 0 0 1 31 13c0 8.5-13 17-13 17z"
                stroke="#5CA09E" stroke-width="2.5" stroke-linejoin="round"/>
          <!-- Cruz en el centro -->
          <path d="M18 13v10M13 18h10"
                stroke="#E89042" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>

      <span class="logo-titulo">Tec con Causa</span>
      <span class="logo-subtitulo">Plataforma de Servicio Social</span>
    </div>

    <!-- Formulario de login -->
    <!-- novalidate = no muestra los mensajes feos del navegador, usamos los nuestros -->
    <form id="formularioLogin" novalidate>

      <!-- Campo de correo -->
      <div class="campo">
        <label for="correo">Correo electrónico</label>
        <!-- for="correo" conecta el label con el input de id="correo" -->
        <input
          id="correo"
          type="email"
          placeholder="nombre@tec.mx"
        />
      </div>

      <!-- Campo de contraseña -->
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <input
          id="contrasena"
          type="password"
          placeholder="Ingresa tu contraseña"
        />
      </div>

      <!-- Mensaje de error (oculto por default) -->
      <p class="mensaje-error" id="mensajeError">
        Por favor ingresa tu correo y contraseña.
      </p>

      <!-- Botón para enviar -->
      <button type="submit" class="btn-login">
        Iniciar Sesión
      </button>

    </form>

    <p class="nota-demo">
      Demo: usa cualquier correo y contraseña para ingresar
    </p>

  </div><!-- fin tarjeta-login -->


  <!-- ===== JAVASCRIPT ===== -->
  <!-- El JS va al final del body para que el HTML ya esté cargado -->
  <script>
    // Buscamos el formulario por su id
    var formulario = document.getElementById('formularioLogin');

    // Cuando alguien hace submit (click en el botón o Enter)
    formulario.addEventListener('submit', function(evento) {

      // Evitamos que la página se recargue (comportamiento normal del form)
      evento.preventDefault();

      // Leemos los valores que escribió el usuario
      var correo     = document.getElementById('correo').value.trim();
      var contrasena = document.getElementById('contrasena').value.trim();
      var error      = document.getElementById('mensajeError');

      // Si alguno está vacío, mostramos el error
      if (correo === '' || contrasena === '') {
        error.style.display = 'block'; // lo hacemos visible
        return; // detenemos el resto del código
      }

      // Si todo está bien, ocultamos el error y vamos al dashboard
      error.style.display = 'none';
      window.location.href = 'dashboard.html'; // redirige a otra página
    });
  </script>

</body>
</html>
