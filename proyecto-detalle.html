        ],
        testimonios: [
          { nombre: 'Margarita Ruiz', rol: 'Productora, 45 años',    iniciales: 'MR', texto: 'Mi familia ahora come verduras frescas todos los días. Aprendimos a cultivar sin químicos y eso nos hace más saludables.' },
          { nombre: 'José García',    rol: 'Coordinador de huerto',   iniciales: 'JG', texto: 'Este proyecto nos ha unido como comunidad. Ya no dependemos tanto de comprar alimentos de fuera.' },
          { nombre: 'Carmen Flores',  rol: 'Beneficiaria',            iniciales: 'CF', texto: 'Es hermoso ver crecer lo que sembramos con nuestras propias manos. Mis hijos me ayudan en el huerto.' }
        ]
      },

      'salud-mental': {
        titulo: 'Salud Mental',
        estado: 'En proceso',
        progreso: 60,
        color: '#9B5BA5',
        descripcion: 'Programas de apoyo psicológico para estudiantes y comunidades vulnerables.',
        descripcionLarga: 'Iniciativa integral de salud mental que proporciona apoyo psicológico accesible. Ofrecemos sesiones individuales, talleres grupales y recursos educativos para promover el bienestar emocional.',
        ubicacion: 'CDMX, Estado de México',
        participantes: '200 beneficiarios',
        fechaInicio: '01 Feb 2026',

        ],

          '300 sesiones completadas',

          '120 beneficiarios activos',
          'Red de apoyo en formación'
        ],
        proximosPasos: [
          'Completar 200 sesiones restantes',
          'Realizar 8 talleres adicionales',

        ],
        testimonios: [
          { nombre: 'Andrea Martínez', rol: 'Estudiante universitaria', iniciales: 'AM', texto: 'Aprendí herramientas para manejar mi ansiedad y ahora me siento más fuerte y capaz de enfrentar los desafíos.' },
          { nombre: 'Roberto Díaz',    rol: 'Beneficiario',              iniciales: 'RD', texto: 'Ya no tengo miedo de pedir ayuda. Los talleres me enseñaron que cuidar mi salud mental es muy importante.' },
          { nombre: 'Sofía Torres',    rol: 'Madre de familia',          iniciales: 'ST', texto: 'Aprendí técnicas de comunicación y ahora nuestra relación familiar es mucho mejor. Agradezco este apoyo.' }
        ]
      },

      'medio-ambiente': {

          { nombre: 'Isabel Vargas', rol: 'Funcionaria municipal', iniciales: 'IV', texto: 'La colaboración nos permitirá implementar soluciones ambientales que nuestra comunidad necesita urgentemente.' },
          { nombre: 'Daniel Morales', rol: 'Especialista ambiental', iniciales: 'DM', texto: 'Este proyecto combina acción directa con educación ambiental. Es el tipo de iniciativa que genera cambios duraderos.' }
        ]
      },

      'desarrollo-comunitario': {
        titulo: 'Desarrollo Comunitario',
        estado: 'Activo',
        progreso: 85,
        color: '#7AB8DD',
        descripcion: 'Fortalecimiento de capacidades locales y liderazgo comunitario.',
        descripcionLarga: 'Programa integral que fortalece las capacidades de liderazgo local, emprendimiento social y gestión de proyectos en comunidades de Morelos y Guerrero.',
        ubicacion: 'Morelos, Guerrero',
        participantes: '60 líderes',
        fechaInicio: '01 Oct 2025',
        fechaFin: '30 Sep 2026',

          { nombre: 'Ernesto Guzmán',  rol: 'Emprendedor social', iniciales: 'EG', texto: 'Gracias al programa pude concretar mi idea de negocio social. Hoy doy empleo a 8 personas de mi comunidad.' },
          { nombre: 'Claudia Reyes',   rol: 'Participante',        iniciales: 'CR', texto: 'Lo más valioso fue conocer a otros líderes comprometidos. Aprendí sobre liderazgo y comunicación efectiva.' }

    }; // fin proyectosData


    // ---- Leemos el id de la URL ----
    // Por ejemplo: proyecto-detalle.html?id=educacion-digital
    // URLSearchParams nos ayuda a leer lo que viene después del "?"
    var parametros = new URLSearchParams(window.location.search);
    var idProyecto = parametros.get('id');  // obtiene el valor de "id"

    var proyecto = proyectosData[idProyecto];

    // Si no encontramos el proyecto, mostramos un mensaje
    if (!proyecto) {
      document.getElementById('contenido').innerHTML = '<p>Proyecto no encontrado.</p>';
    } else {

      // ---- Guardamos el color para usarlo en varios lugares ----
      var color = proyecto.color;

      // ---- Creamos las listas de objetivos, logros y pasos ----

      // Objetivos: puntito de color
      var htmlObjetivos = '';
      for (var i = 0; i < proyecto.objetivos.length; i++) {
        htmlObjetivos += `
          <li>
            <div class="li-punto" style="background-color: ${color};"></div>
            <span>${proyecto.objetivos[i]}</span>
          </li>`;
      }

      // Logros: palomita verde
      var htmlLogros = '';
      for (var i = 0; i < proyecto.logros.length; i++) {
        htmlLogros += `
          <li>
            <span style="color: #16a34a; font-size: 1rem;">✓</span>
            <span>${proyecto.logros[i]}</span>
          </li>`;
      }

      // Próximos pasos: anillito con borde
      var htmlPasos = '';
      for (var i = 0; i < proyecto.proximosPasos.length; i++) {
        htmlPasos += `
          <li>
            <div class="li-anillo" style="border-color: ${color};"></div>
            <span>${proyecto.proximosPasos[i]}</span>
          </li>`;
      }

      // ---- Creamos las tarjetas de testimonios ----
      var htmlTestimonios = '';
      for (var i = 0; i < proyecto.testimonios.length; i++) {
        var t = proyecto.testimonios[i];
        htmlTestimonios += `
          <div class="tarjeta-testimonio">
            <!-- Comillas decorativas grandes -->
            <div class="icono-comillas" style="color: ${color};">"</div>
            <p class="testimonio-texto">"${t.texto}"</p>
            <div class="testimonio-pie">
              <!-- Avatar con iniciales -->
              <div class="avatar" style="background-color: ${color}33; color: ${color};">
                ${t.iniciales}
              </div>
              <div>
                <div class="testimonio-nombre">${t.nombre}</div>
                <div class="testimonio-rol">${t.rol}</div>
              </div>
            </div>
          </div>`;
      }

      // ---- Ahora juntamos todo en un gran bloque de HTML ----
      var htmlCompleto = `

        <!-- HÉROE: bloque grande de color -->
        <div class="hero" style="background-color: ${color};">
          <div class="hero-arriba">
            <div class="hero-icono">
              <!-- Ícono de proyecto -->
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                   stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
              </svg>
            </div>
            <span class="hero-badge">${proyecto.estado}</span>
          </div>

          <h1>${proyecto.titulo}</h1>
          <p>${proyecto.descripcionLarga}</p>

          <!-- Barra de progreso -->
          <div class="hero-progreso">
            <div class="hero-progreso-etiquetas">
              <span>Progreso del proyecto</span>
              <span>${proyecto.progreso}%</span>
            </div>
            <div class="hero-barra-fondo">
              <div class="hero-barra-relleno" style="width: ${proyecto.progreso}%;"></div>
            </div>
          </div>
        </div>


        <!-- DATOS: ubicación, participantes, fechas, presupuesto -->
        <div class="fila-datos">
          <div class="tarjeta-dato">
            <div class="dato-label">📍 Ubicación</div>
            <div class="dato-valor">${proyecto.ubicacion}</div>
          </div>
          <div class="tarjeta-dato">
            <div class="dato-label">👥 Participantes</div>
            <div class="dato-valor">${proyecto.participantes}</div>
          </div>
          <div class="tarjeta-dato">
            <div class="dato-label">📅 Duración</div>
            <div class="dato-valor">${proyecto.fechaInicio} – ${proyecto.fechaFin}</div>
          </div>
          <div class="tarjeta-dato">
            <div class="dato-label">💰 Presupuesto</div>
            <div class="dato-valor">${proyecto.presupuesto}</div>
          </div>
        </div>


        <!-- TRES COLUMNAS: objetivos, logros, próximos pasos -->
        <div class="tres-columnas">

          <div class="tarjeta-info">
            <div class="info-titulo" style="color: ${color};">⭕ Objetivos</div>
            <div class="info-subtitulo">Metas principales del proyecto</div>
            <ul class="lista-info">${htmlObjetivos}</ul>
          </div>

          <div class="tarjeta-info">
            <div class="info-titulo" style="color: ${color};">✅ Logros</div>
            <div class="info-subtitulo">Lo que hemos conseguido</div>
            <ul class="lista-info">${htmlLogros}</ul>
          </div>

          <div class="tarjeta-info">
            <div class="info-titulo" style="color: ${color};">🕐 Próximos Pasos</div>
            <div class="info-subtitulo">Siguientes actividades</div>
            <ul class="lista-info">${htmlPasos}</ul>
          </div>

        </div>


        <!-- TESTIMONIOS -->
        <div class="seccion-titulo">Testimonios</div>
        <div class="seccion-subtitulo">Lo que dicen los participantes del proyecto</div>
        <div class="cuadricula-testimonios">
          ${htmlTestimonios}
        </div>


        <!-- COORDINADOR -->
        <div class="tarjeta-coordinador">
          <div class="coordinador-avatar" style="background-color: ${color}22; color: ${color};">
            <!-- Ícono de persona -->
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div>
            <div class="coordinador-nombre">${proyecto.coordinador}</div>
            <div class="coordinador-rol">Coordinador del Proyecto</div>
          </div>
        </div>


        <!-- BOTONES DE ACCIÓN -->
        <div class="fila-botones">
          <a class="btn-principal" href="#" style="background-color: ${color};">
            Unirse al Proyecto
          </a>
          <a class="btn-borde" href="#">
            Descargar Informe
          </a>
          <a class="btn-borde" href="#">
            Compartir Proyecto
          </a>
        </div>

      `;

      // Insertamos todo el HTML en el div de "contenido"
      document.getElementById('contenido').innerHTML = htmlCompleto;

      // Cambiamos el título de la pestaña del navegador
      document.title = 'Tec con Causa – ' + proyecto.titulo;
    }

  </script>
